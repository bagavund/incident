<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    # Serve the built SPA shell for "/" directly; deep links (/incidents/…) fall
    # through .htaccess to Laravel, whose catch-all returns the same index.html.
    DirectoryIndex index.html index.php

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
