# ЛОКАЛЬНАЯ разработка/демо — поднимает всё три сервиса разом.
# НЕ для стендов и прода: там APP_ENV=production, секреты из хранилища,
# внешняя БД, а backend и frontend деплоятся из своих репозиториев
# (ims/backend/core и ims/frontend/admin) отдельными образами. См. DEPLOY.md.
services:
  backend:
    build: ./backend
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      # Фиксированные dev-ключи, чтобы токены/сессии переживали пересборку.
      APP_KEY: base64:HyZmA9eUVEOidQlETvyr+iSPCEIUZiA5t9cg9IE5d2E=
      JWT_SECRET: f0dd75ac7345d96ab263d8567b0214875ac48a66f53a95ff6cee9d2b2d4489ed
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ims
      DB_USERNAME: ims
      DB_PASSWORD: ims
      CACHE_STORE: database
      # Local-dev only — заведомо слабый пароль. На проде обязателен и приходит
      # из секретов; сидер падает, если он не задан при APP_ENV=production.
      ADMIN_PASSWORD: password
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"          # http://localhost:8080 — SPA + проксируемый /api
    environment:
      BACKEND_URL: http://backend:80
    depends_on:
      - backend
    restart: unless-stopped

  db:
    image: mysql:8.4
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ims
      MYSQL_USER: ims
      MYSQL_PASSWORD: ims
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - ims-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  ims-db:
